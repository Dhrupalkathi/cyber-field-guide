[project]
site_name = "CINS Cyber Field Guide"
site_description = "A practical, community-maintained cybersecurity learning hub: foundations, tools, resources, and curriculum."
site_url = "https://dhrupalkathi.github.io/cyber-field-guide/"
repo_url = "https://github.com/Dhrupalkathi/cyber-field-guide"
repo_name = "CINS Cyber Field Guide"
edit_uri = "edit/main/docs/"
extra_css = [
  "stylesheets/extra.css",
]
extra_javascript = [
  "javascripts/homepage-effects.js",
]

nav = [
  "index.md",
  { "Start Here" = [
    "start-here/index.md",
  ] },
  { "Curriculum" = [
    "curriculum/index.md",
    { "Stage 0 — Orientation" = "curriculum/stage-0.md" },
    { "Stage 1 — Computer Fundamentals" = "curriculum/stage-1-computer-fundamentals.md" },
    { "Stage 1 — Python Track" = "curriculum/stage-1-python-track.md" },
    { "Stage 2 — Networking" = "curriculum/stage-2-networking.md" },
    { "Stage 2 — Linux" = "curriculum/stage-2-linux.md" },
    { "Stage 2 — Windows" = "curriculum/stage-2-windows.md" },
    { "Stage 2 — Internet and Web" = "curriculum/stage-2-web-fundamentals.md" },
    { "Stage 3 — Cybersecurity Core" = "curriculum/stage-3-cybersecurity-core.md" },
    { "Stage 4 — Domain Exploration" = "curriculum/stage-4-domain-exploration.md" },
    { "Stage 5 — Specialisation and Advanced Study" = "curriculum/stage-5-specialisation.md" },
    { "Mentor Guide" = "curriculum/mentor-guide.md" },
  ] },
  { "Tool Library" = [
    "tools/index.md",
  ] },
  { "Learning Resources" = [
    "resources/index.md",
    { "Foundations & Computing" = "resources/foundations.md" },
    { "Networking" = "resources/networking.md" },
    { "Linux" = "resources/linux.md" },
    { "Windows" = "resources/windows.md" },
    { "Web & Internet Fundamentals" = "resources/web-fundamentals.md" },
    { "Cybersecurity Core" = "resources/security-fundamentals.md" },
    { "Web & API Security" = "resources/web-security.md" },
    { "Blue Team & SOC" = "resources/blue-team.md" },
    { "Digital Forensics" = "resources/digital-forensics.md" },
    { "Cloud & Containers" = "resources/cloud-and-containers.md" },
    { "Mobile & Reverse Engineering" = "resources/mobile-and-reverse-engineering.md" },
    { "CTFs & Labs" = "resources/ctf-and-practice.md" },
    { "YouTube Channels" = "resources/video-channels.md" },
    { "Communities & Careers" = "resources/communities-and-careers.md" },
  ] },
  { "Club Hub" = [
    "club/index.md",
    "club/safety-and-ethics.md",
    "club/contributing.md",
    "club/content-standards.md",
    "club/content-audit.md",
    "club/release-notes.md",
    "club/code-of-conduct.md",
    "club/resource-entry-template.md",
    "club/tool-entry-template.md",
  ] },
]

[project.extra]
generator = false

[project.theme]
logo = "assets/dau-cins-club.webp"
favicon = "assets/dau-cins-club.webp"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.suggest",
  "search.highlight",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# HTML-in-Markdown and attribute-list support for homepage cards and buttons.
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
