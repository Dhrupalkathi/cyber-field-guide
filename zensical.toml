[project]
site_name = "CINS Cyber Field Guide"
site_description = "A practical, community-maintained cybersecurity learning hub: foundations, tools, resources, labs, and learning paths."
site_url = "https://dhrupalkathi.github.io/cyber-field-guide/"
repo_url = "https://github.com/Dhrupalkathi/cyber-field-guide"
repo_name = "CINS Cyber Field Guide"
edit_uri = "edit/main/docs/"
extra_css = [
  "stylesheets/extra.css",
]

nav = [
  "index.md",
  { "Start Here" = [
    "start-here/index.md",
    "start-here/learning-order.md",
  ] },
  { "Tool Library" = [
    "tools/index.md",
  ] },
  { "Learn & Practise" = [
    "resources/index.md",
    { "Networking" = "resources/networking.md" },
    { "Linux & Kali" = "resources/linux.md" },
    { "Web Security" = "resources/web-security.md" },
    { "Blue Team & SOC" = "resources/blue-team.md" },
    { "Digital Forensics" = "resources/digital-forensics.md" },
    { "Cloud & Containers" = "resources/cloud-and-containers.md" },
    { "Mobile & Reverse Engineering" = "resources/mobile-and-reverse-engineering.md" },
    { "CTFs & Practice" = "resources/ctf-and-practice.md" },
    { "YouTube Channels" = "resources/video-channels.md" },
    { "Communities & Careers" = "resources/communities-and-careers.md" },
  ] },
  { "Learning Paths" = [
    "learning-paths/index.md",
  ] },
  { "Club Hub" = [
    "club/index.md",
    "club/safety-and-ethics.md",
    "club/contributing.md",
  ] },
]

[project.theme]
logo = "assets/cins-shield.webp"
favicon = "assets/cins-shield.webp"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.suggest",
  "search.highlight",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# HTML-in-Markdown and attribute-list support for homepage cards and buttons.
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
