name: Build and publish documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Avoid overlapping builds/deployments for the same branch.
# A newer main-branch change supersedes an older pending publish.
concurrency:
  group: cins-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install the pinned documentation builder
        run: python -m pip install -r requirements.txt

      - name: Build the site
        run: zensical build --clean

      - name: Check generated links, accessibility metadata, and asset budgets
        run: python scripts/check_site.py --site-dir site

      - name: Upload the built site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy the documentation
        id: deployment
        uses: actions/deploy-pages@v5
